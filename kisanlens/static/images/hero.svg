    <path d="M90 440c-14-4-20-14-18-26 12 2 20 12 18 26z"/><path d="M190 436c-14-4-20-14-18-26 12 2 20 12 18 26z"/>
    <path d="M290 434c-14-4-20-14-18-26 12 2 20 12 18 26z"/><path d="M390 432c-14-4-20-14-18-26 12 2 20 12 18 26z"/>
    <path d="M490 428c-14-4-20-14-18-26 12 2 20 12 18 26z"/><path d="M580 424c-14-4-20-14-18-26 12 2 20 12 18 26z"/>
